[package]
name = "meltrix"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow"] }
rfd = "0.17.2"
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "mkv", "aac", "alac", "mpa", "flac", "vorbis", "pcm", "all-meta", "opt-simd"] }
mp3lame-encoder = { version = "0.2.5", features = ["std"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico", "tga", "qoi", "pnm"] }
webp = { version = "0.3.1", default-features = false }
jpeg-encoder = { version = "0.7.1", features = ["simd"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 3
